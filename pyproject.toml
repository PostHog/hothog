[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hothog"
version = "0.1.0"
description = "Find the imports hogging your hot path — and the single best place to defer each one."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "PostHog" }]
keywords = ["imports", "importtime", "startup", "lazy-imports", "defer", "profiling", "django", "dominators"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "grimp>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/PostHog/hothog"
Issues = "https://github.com/PostHog/hothog/issues"

[project.scripts]
hothog = "hothog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hothog"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
